<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolTip Ui</title>
    <link rel="stylesheet" href="./style.css" >
</head>

<body>
    <div class="navbar">
        <nav>
            <ul>
                <li>
                    <a class="tooltip" href="https://music.youtube.com/watch?v=COz9lDCFHjw&list=RDAMVMWKZO-CWeOVA" target="_blank">
                        Music
                    <span class="tooltiptext" >Listen to music!</span>
                    </a>
                </li>
                <li>
                    <a class="tooltip" href="https://github.com/viv-7" target="_blank">
                        GitHub
                    <span class="tooltiptext" >Go to github profile</span>
                    </a>
                </li>
                <li>
                    <a class="tooltip" href="https://www.youtube.com/" target="_blank">
                        YouTube
                    <span class="tooltiptext" >Go to YouTube.com</span>
                    </a>
                </li>
            </ul>
        </nav>

    </div>
    
    
</body>
</html>
